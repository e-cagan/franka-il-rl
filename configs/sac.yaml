# SAC baseline config (no HER)

# Algorithm
gamma: 0.99
tau: 0.005
init_alpha: 0.2
# -|A|/2 = -2. Note: -|A| (Haarnoja default) is unreachable for a 4-D
# tanh-squashed Gaussian since H_max = 4*log(2) ≈ 2.77. Targeting -|A|
# causes auto-alpha to runaway upward and Q to diverge.
target_entropy: -2.0

# Environment
reward_type: "sparse"

# Networks
obs_dim: 28
action_dim: 4
policy_hidden: [256, 256]
q_hidden: [256, 256]

# Optimization
lr_actor: 3.0e-4
lr_critic: 3.0e-4
lr_alpha: 3.0e-4
batch_size: 256

# Training
total_env_steps: 100000
warmup_steps: 1000
updates_per_step: 1
eval_every_steps: 5000
eval_episodes: 20

# Buffer
buffer_capacity: 200000

# Hardware
device: "cuda"

# Logging
run_name: "sac_baseline"
wandb_project: "franka-il-rl"
wandb_tags: ["sac", "fetch", "baseline"]
wandb_group: "sac_baseline"

# Checkpointing
checkpoint_dir: "data/checkpoints/sac"